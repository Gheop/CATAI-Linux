name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install ruff && ruff check catai_linux/

      - name: Happy cat
        if: success()
        run: |
          echo ""
          echo "  /\_/\  ("
          echo " ( ^.^ ) _)"
          echo '   \"/  ('
          echo " ( | | )"
          echo "(__d b__)  Lint passed!"
          echo ""
